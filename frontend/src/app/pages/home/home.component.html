<div class="home-container">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <mat-card class="home-card">
    <div class="card-accent"></div>

    <div class="brand-badge">
      <span class="badge-dot"></span>
      QuickMart
    </div>

    <h1>Quick <span class="highlight">Mart</span> Shop</h1>
    <p>
      Your one-stop shop for everything online — curated products, unbeatable
      prices, delivered fast.
    </p>

    <div class="card-stats">
      <div class="stat">
        <span class="stat-num">2.4M+</span>
        <span class="stat-label">Products</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-num">98%</span>
        <span class="stat-label">Satisfaction</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-num">180+</span>
        <span class="stat-label">Countries</span>
      </div>
    </div>

    <button mat-raised-button color="primary" routerLink="/login">
      Get Started
      <span class="btn-arrow">→</span>
    </button>

    <p class="sub-note">No credit card required · Free forever</p>
  </mat-card>
</div>
